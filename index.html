<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Сперма-Шутер: Война Миров</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  body {
    margin: 0; background: #050510; color: #fff;
    font-family: 'Courier New', Courier, monospace;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 100vh; overflow: hidden;
    touch-action: none;
  }
  canvas { background: #111; border: 2px solid #ff0055; box-shadow: 0 0 20px #ff0055; border-radius: 8px; }
  
  #hud {
    position: fixed; top: 10px; left: 10px; right: 10px;
    display: flex; justify-content: space-between;
    font-size: 20px; font-weight: bold; color: #ff0055;
    text-shadow: 0 0 10px #ff0055; pointer-events: none; z-index: 5;
  }

  #menu {
    position: fixed; inset: 0; background: rgba(5, 5, 16, 0.95);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 10; text-align: center; overflow-y: auto; padding: 20px;
  }
  #menu h1 { font-size: 32px; color: #ff0055; text-shadow: 0 0 20px #ff0055; margin-bottom: 5px; letter-spacing: 2px; }
  #menu h2 { font-size: 16px; color: #00ffff; text-shadow: 0 0 10px #00ffff; margin-top: 0; margin-bottom: 20px; }
  
  .level-select { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center; }
  .lvl-btn {
    width: 50px; height: 50px; border-radius: 50%; background: #222; border: 3px solid #555;
    color: #888; font-size: 20px; font-weight: bold; cursor: pointer; transition: 0.2s;
  }
  .lvl-btn.active { border-color: #00ffff; color: #00ffff; box-shadow: 0 0 15px #00ffff inset; }
  .lvl-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .btn {
    background: transparent; color: #fff; border: 2px solid #ff0055;
    padding: 12px 30px; font-size: 18px; font-family: inherit; font-weight: bold;
    margin: 10px; cursor: pointer; text-transform: uppercase;
    box-shadow: 0 0 10px #ff0055 inset; transition: 0.2s; border-radius: 5px;
  }
  .btn:hover, .btn:active { background: #ff0055; color: #000; box-shadow: 0 0 20px #ff0055 inset; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="hud">
  <div id="score">Уровень: 1</div>
  <div id="hp">HP: ❤️❤️❤️</div>
</div>

<canvas id="game"></canvas>

<div id="menu">
  <h1>СПЕРМА-ШУТЕР</h1>
  <h2>ПУТЬ К МАГНИТУ</h2>
  
  <div class="level-select" id="levelSelect"></div>
  <button class="btn" id="startBtn">Играть</button>
</div>

<script>
    const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const hpEl = document.getElementById('hp');
const menuEl = document.getElementById('menu');
const levelSelectEl = document.getElementById('levelSelect');

let W, H;
function resize() {
  W = Math.min(window.innerWidth - 20, 800);
  H = Math.min(window.innerHeight - 40, 600);
  canvas.width = W; canvas.height = H;
}
window.addEventListener('resize', resize);
resize();

let audioCtx = null;
let musicInt = null;
let currentLevel = 1;
let maxUnlockedLevel = 1;

const LEVEL_THEMES = [
  { name: "Лес", bg: '#0a1a0a', tree: '#0d2a0d', ground: '#1a3a1a' },
  { name: "Пустыня", bg: '#2a1a0a', tree: '#3a2a0d', ground: '#4a3a1a' },
  { name: "Ночь", bg: '#050510', tree: '#0d0d1a', ground: '#1a1a3a' },
  { name: "Лава", bg: '#1a0505', tree: '#2a0d0d', ground: '#3a1a1a' },
  { name: "Матрица", bg: '#001100', tree: '#002200', ground: '#003300' }
];

function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playShootSound() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
  osc.type = 'square'; osc.frequency.setValueAtTime(600, t); osc.frequency.exponentialRampToValueAtTime(200, t + 0.1);
  gain.gain.setValueAtTime(0.05, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
  osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.1);
}

function playHitSound() {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const bufferSize = audioCtx.sampleRate * 0.1;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  const noise = audioCtx.createBufferSource(); noise.buffer = buffer;
  const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.value = 1000;
  const gain = audioCtx.createGain(); gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
  noise.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination); noise.start(t);
}

function startMusic(level) {
  if (!audioCtx) return;
  if (musicInt) clearInterval(musicInt);
  
  const bpm = 120 + (level * 5); 
  const stepTime = 60 / bpm / 4; 
  let step = 0;
  let bassRiff = [];
  let leadRiff = [];

  if (level === 1) { bassRiff = [45, 45, 48, 45, 50, 45, 48, 45, 45, 45, 48, 45, 51, 50, 48, 45]; leadRiff = [69, 72, 76, 72, 74, 72, 69, 65]; }
  else if (level === 2) { bassRiff = [40, 40, 43, 40, 45, 40, 43, 40, 40, 40, 43, 40, 46, 45, 43, 40]; leadRiff = [64, 67, 70, 67, 64, 62, 60, 62]; }
  else if (level === 3) { bassRiff = [36, 36, 38, 36, 41, 36, 38, 36, 36, 36, 38, 36, 43, 41, 38, 36]; leadRiff = [60, 63, 65, 63, 60, 58, 56, 58]; }
  else if (level === 4) { bassRiff = [50, 50, 53, 50, 55, 50, 53, 50, 50, 50, 53, 50, 57, 55, 53, 50]; leadRiff = [74, 77, 81, 77, 79, 77, 74, 70]; }
  else { bassRiff = [48, 48, 48, 50, 48, 48, 53, 48, 48, 48, 48, 50, 55, 53, 50, 48]; leadRiff = [72, 72, 75, 72, 77, 72, 75, 72]; }

  musicInt = setInterval(() => {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;

    if (step % 2 === 0) {
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(bassRiff[Math.floor(step/2) % 16], t);
      const filter = audioCtx.createBiquadFilter(); filter.type = 'lowpass'; filter.frequency.setValueAtTime(500, t);
      gain.gain.setValueAtTime(0.1, t); gain.gain.exponentialRampToValueAtTime(0.01, t + stepTime * 1.5);
      osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + stepTime * 1.8);
    }

    if (step % 8 === 0 || step % 8 === 4) {
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(100, t); osc.frequency.exponentialRampToValueAtTime(30, t + 0.1);
      gain.gain.setValueAtTime(0.5, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
      osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.1);
    }

    if (step % 4 === 2) {
      const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
      osc.type = 'square'; osc.frequency.setValueAtTime(leadRiff[Math.floor(step/4) % 8], t);
      gain.gain.setValueAtTime(0.05, t); gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
      osc.connect(gain); gain.connect(audioCtx.destination); osc.start(t); osc.stop(t + 0.1);
    }
    step = (step + 1) % 32;
  }, stepTime * 1000);
}

let player, enemies, bullets, particles, level, cameraX, running, gameOver;
let keys = { left: false, right: false, jump: false, shoot: false };
const GRAVITY = 0.6; const JUMP_POWER = -12; const SPEED = 5; 
const TILE = 40; const LEVEL_LENGTH = 4000;

function initLevelSelect() {
  levelSelectEl.innerHTML = '';
  for (let i = 1; i <= 5; i++) {
    const btn = document.createElement('button');
    btn.className = 'lvl-btn';
    if (i === currentLevel) btn.classList.add('active');
    if (i > maxUnlockedLevel) btn.disabled = true;
    btn.textContent = i;
    btn.onclick = () => { currentLevel = i; initLevelSelect(); };
    levelSelectEl.appendChild(btn);
  }
}

function resetGame() {
  level = currentLevel;
  player = { x: 100, y: H - TILE - 50, w: 30, h: 60, vx: 0, vy: 0, onGround: false, hp: 3, shootCooldown: 0, facing: 1, invuln: 0 };
  enemies = []; bullets = []; particles = []; cameraX = 0; gameOver = false; running = true;
  keys.left = false; keys.right = false; keys.jump = false; keys.shoot = false;
  updateHUD(); spawnEnemies();
}

function spawnEnemies() {
  enemies = [];
  const count = 3 + level * 2;
  for (let i = 0; i < count; i++) {
    const ex = 800 + Math.random() * (LEVEL_LENGTH - 1000);
    enemies.push({
      x: ex, y: H - TILE - 90, w: 40, h: 50, hp: 2 + level,
      vx: 0.5 + (level * 0.1),
      direction: Math.random() > 0.5 ? 1 : -1,
      startX: ex, patrolRange: 100 + Math.random() * 200,
      vy: 0, time: Math.random() * 10
    });
  }
}

function updateHUD() {
  scoreEl.textContent = `Уровень: ${level}`;
  hpEl.textContent = `HP: ${'❤️'.repeat(Math.max(0, player.hp))}`;
}

function drawPyaterochka(x, y) {
  if (x < -300 || x > W + 300) return;
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.beginPath(); ctx.ellipse(x + 80, y + 5, 90, 20, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#c0c0c0'; ctx.fillRect(x - 20, y - 200, 200, 200);
  ctx.fillStyle = '#008000'; ctx.fillRect(x - 25, y - 220, 210, 20);
  ctx.fillStyle = '#111'; ctx.fillRect(x + 20, y - 100, 120, 100);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(x, y - 280, 160, 50);
  ctx.strokeStyle = '#008000'; ctx.lineWidth = 4; ctx.strokeRect(x, y - 280, 160, 50);
  ctx.fillStyle = '#008000'; ctx.font = 'bold 40px Arial, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('5', x + 30, y - 255);
  ctx.font = 'bold 18px Arial, sans-serif'; ctx.fillText('ПЯТЁРОЧКА', x + 95, y - 255); 
  ctx.textBaseline = 'alphabetic';
}

function drawMagnit(x, y) {
  if (x < -400 || x > W + 400) return;
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.beginPath(); ctx.ellipse(x + 100, y + 5, 120, 25, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#e0e0e0'; ctx.fillRect(x - 20, y - 280, 240, 280);
  ctx.fillStyle = '#999'; ctx.fillRect(x - 30, y - 300, 260, 20);
  ctx.fillStyle = '#111'; ctx.fillRect(x + 40, y - 140, 120, 140);
  ctx.fillStyle = '#cc0000'; ctx.fillRect(x - 30, y - 320, 260, 30);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(x + 10, y - 380, 180, 60);
  ctx.strokeStyle = '#cc0000'; ctx.lineWidth = 5; ctx.strokeRect(x + 10, y - 380, 180, 60);
  ctx.fillStyle = '#cc0000'; ctx.font = 'bold 36px Arial, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('МАГНИТ', x + 100, y - 350); ctx.textBaseline = 'alphabetic';
  ctx.shadowBlur = 20; ctx.shadowColor = '#ff0000'; ctx.strokeStyle = '#ff0000'; ctx.lineWidth = 3;
  ctx.strokeRect(x + 10, y - 380, 180, 60); ctx.shadowBlur = 0;
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  const theme = LEVEL_THEMES[level - 1];
  ctx.fillStyle = theme.bg; ctx.fillRect(0, 0, W, H);
  
  ctx.fillStyle = theme.tree;
  for (let i = 0; i < 30; i++) {
    const tx = (i * 200 - cameraX * 0.5) % (W + 200) - 100;
    ctx.beginPath(); ctx.moveTo(tx, H); ctx.lineTo(tx+50, H-300); ctx.lineTo(tx+100, H); ctx.fill();
  }
  
  ctx.fillStyle = theme.ground; ctx.fillRect(0, H - TILE, W, TILE);
  drawPyaterochka(100 - cameraX, H - TILE);
  drawMagnit(LEVEL_LENGTH - cameraX, H - TILE);

  bullets.forEach(b => {
    const bx = b.x - cameraX;
    ctx.fillStyle = '#fff'; ctx.shadowBlur = 10; ctx.shadowColor = '#fff';
    ctx.beginPath(); ctx.ellipse(bx, b.y, 10, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(bx - b.vx * 0.5, b.y); ctx.quadraticCurveTo(bx - b.vx, b.y - 10, bx - b.vx * 1.5, b.y);
    ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke(); ctx.shadowBlur = 0;
  });

  // ВРАГИ (СИСЬКИ БЕЗ НОГ)
  enemies.forEach(e => {
    if (e.hp <= 0) return; const ex = e.x - cameraX; if (ex < -50 || ex > W + 50) return;
    
    // Легкое покачивание в воздухе (эффект парения)
    const floatY = Math.sin(e.time * 3) * 10;
    const ey = e.y + floatY;

    const g1 = ctx.createRadialGradient(ex - 10, ey, 2, ex, ey + 10, 20); g1.addColorStop(0, '#ffb3c6'); g1.addColorStop(1, '#c96b6b');
    ctx.fillStyle = g1; ctx.beginPath(); ctx.arc(ex - 10, ey + 10, 18, 0, Math.PI * 2); ctx.fill();
    const g2 = ctx.createRadialGradient(ex + 10, ey, 2, ex + 20, ey + 10, 20); g2.addColorStop(0, '#ffb3c6'); g2.addColorStop(1, '#c96b6b');
    ctx.fillStyle = g2; ctx.beginPath(); ctx.arc(ex + 10, ey + 10, 18, 0, Math.PI * 2); ctx.fill();
    
    ctx.fillStyle = '#a04040'; ctx.beginPath(); ctx.arc(ex - 10, ey + 10, 4, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(ex + 10, ey + 10, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(ex - 8, ey, 3, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(ex + 8, ey, 3, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#f00'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(ex - 12, ey - 5); ctx.lineTo(ex - 4, ey - 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ex + 12, ey - 5); ctx.lineTo(ex + 4, ey - 2); ctx.stroke();
  });

  particles.forEach(p => { ctx.fillStyle = p.color; ctx.globalAlpha = p.life; ctx.beginPath(); ctx.arc(p.x - cameraX, p.y, p.size, 0, Math.PI * 2); ctx.fill(); });
  ctx.globalAlpha = 1;

  // ИГРОК (ПЕНИС С УРЕТРОЙ)
  const px = player.x - cameraX; const py = player.y;
  if (player.invuln > 0 && Math.floor(Date.now() / 100) % 2 === 0) {
  } else {
    // Основание
    ctx.fillStyle = '#c98d6b'; ctx.beginPath(); ctx.roundRect(px - 18, py + 40, 36, 20, 5); ctx.fill();
    
    // Ствол с венами
    const bodyGrad = ctx.createLinearGradient(px, py, px + 30, py);
    bodyGrad.addColorStop(0, '#f0c4a1'); bodyGrad.addColorStop(0.5, '#d9a07a'); bodyGrad.addColorStop(1, '#a97052');
    ctx.fillStyle = bodyGrad; ctx.beginPath(); ctx.roundRect(px - 12, py + 10, 24, 40, 8); ctx.fill();
    ctx.strokeStyle = '#b98263'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(px - 5, py + 15); ctx.quadraticCurveTo(px + 5, py + 25, px - 5, py + 35); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(px + 8, py + 12); ctx.quadraticCurveTo(px - 2, py + 20, px + 8, py + 30); ctx.stroke();

    // Головка
    const hx = px + (player.facing === 1 ? 8 : -8);
    const hg = ctx.createRadialGradient(hx - 5, py + 10, 2, hx, py, 25);
    hg.addColorStop(0, '#fce1cf'); hg.addColorStop(0.5, '#e0a888'); hg.addColorStop(1, '#b97d60');
    ctx.fillStyle = hg; ctx.beginPath(); ctx.ellipse(hx, py, 22, 26, 0, 0, Math.PI * 2); ctx.fill();
    
    // Венечная борозда
    ctx.strokeStyle = 'rgba(140, 80, 55, 0.9)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(hx - (player.facing === 1 ? 8 : -8), py - 15); ctx.lineTo(hx - (player.facing === 1 ? 8 : -8), py + 15); ctx.stroke();
    
    // Уретра (отверстие для стрельбы)
    ctx.fillStyle = '#5a3a2a'; ctx.beginPath(); ctx.ellipse(hx + (player.facing === 1 ? 12 : -12), py, 3, 5, 0, 0, Math.PI * 2); ctx.fill();

    // Яйца
    ctx.fillStyle = '#b98263'; ctx.beginPath(); ctx.arc(px - 12, py + 60, 16, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(px + 12, py + 60, 16, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.beginPath(); ctx.arc(px - 15, py + 55, 5, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(px + 9, py + 55, 5, 0, Math.PI * 2); ctx.fill();
  }

  ctx.globalAlpha = 0.3; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(60, H - 60, 40, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(W - 60, H - 60, 40, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.font = '14px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('ПРЫЖОК', 60, H - 55); ctx.fillText('ОГОНЬ', W - 60, H - 55);

  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.8)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#ff0055'; ctx.font = '40px Courier New'; ctx.textAlign = 'center'; ctx.fillText('ТЫ УМЕР', W/2, H/2 - 20);
    ctx.fillStyle = '#fff'; ctx.font = '20px Courier New'; ctx.fillText('Нажми, чтобы начать заново', W/2, H/2 + 30);
  }
}
function update() {
  if (!running) return;
  player.vx = 0;
  if (keys.left) { player.vx = -SPEED; player.facing = -1; }
  if (keys.right) { player.vx = SPEED; player.facing = 1; }
  player.x += player.vx;
  if (player.x < 50) player.x = 50;
  if (player.x > LEVEL_LENGTH - 50) player.x = LEVEL_LENGTH - 50;
  
  if (keys.jump && player.onGround) { player.vy = JUMP_POWER; player.onGround = false; }
  player.vy += GRAVITY; player.y += player.vy;
  if (player.y + player.h > H - TILE) { player.y = H - TILE - player.h; player.vy = 0; player.onGround = true; }

  if (keys.shoot && player.shootCooldown <= 0) {
    // Стреляем ИЗ УРЕТРЫ (учитываем направление)
    const hx = player.x + (player.facing === 1 ? 20 : -20);
    bullets.push({ x: hx, y: player.y + 5, vx: player.facing * 18, damage: 1 });
    player.shootCooldown = 15; playShootSound();
  }
  if (player.shootCooldown > 0) player.shootCooldown--;
  if (player.invuln > 0) player.invuln--;

  const targetCam = player.x - W / 3; cameraX += (targetCam - cameraX) * 0.1;

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i]; b.x += b.vx;
    if (b.x < cameraX - 100 || b.x > cameraX + W + 100) { bullets.splice(i, 1); continue; }
    for (let e of enemies) {
      if (e.hp <= 0) continue;
      // Коллизия с учетом парения
      const floatY = Math.sin(e.time * 3) * 10;
      if (Math.hypot(b.x - e.x, b.y - (e.y + floatY + 10)) < 35) {
        e.hp -= b.damage; bullets.splice(i, 1); playHitSound();
        for (let p = 0; p < 5; p++) {
          particles.push({ x: e.x, y: e.y + floatY + 10, vx: (Math.random()-0.5)*10, vy: (Math.random()-0.5)*10, life: 1, size: Math.random()*5 + 3, color: '#fff' });
        }
        break;
      }
    }
  }

  enemies.forEach(e => {
    if (e.hp <= 0) return; 
    e.time += 0.1;
    e.x += e.vx * e.direction;
    if (Math.abs(e.x - e.startX) > e.patrolRange) e.direction *= -1;

    // Коллизия с игроком
    const floatY = Math.sin(e.time * 3) * 10;
    if (player.invuln <= 0 && Math.hypot(player.x - e.x, player.y + 20 - (e.y + floatY + 10)) < 45) {
      player.hp--; player.invuln = 60; updateHUD(); playHitSound();
      for (let p = 0; p < 10; p++) {
        particles.push({ x: player.x, y: player.y + 20, vx: (Math.random()-0.5)*15, vy: (Math.random()-0.5)*15, life: 1, size: Math.random()*6 + 3, color: '#ff0000' });
      }
      if (player.hp <= 0) { running = false; gameOver = true; setTimeout(() => location.reload(), 3000); }
    }
  });

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.5; p.life -= 0.03;
    if (p.life <= 0) particles.splice(i, 1);
  }

  if (player.x >= LEVEL_LENGTH - 140) {
    running = false;
    if (level >= maxUnlockedLevel && level < 5) maxUnlockedLevel = level + 1;
    if (level >= 5) { alert("ПОБЕДА!"); location.reload(); } 
    else {
      currentLevel = level + 1;
      menuEl.classList.remove('hidden');
      initLevelSelect();
      document.getElementById('startBtn').textContent = 'Следующий уровень';
    }
  }
}

function loop() { if (running) update(); draw(); requestAnimationFrame(loop); }

function handleTouch(e, isStart) {
  e.preventDefault(); if (!running) { if (gameOver) location.reload(); return; }
  const touch = e.changedTouches ? e.changedTouches[0] : e;
  const rect = canvas.getBoundingClientRect();
  const x = touch.clientX - rect.left; const y = touch.clientY - rect.top;
  if (y > H - 120) {
    if (x < W / 2) keys.jump = isStart;
    else keys.shoot = isStart;
  } else {
    if (isStart) { if (x < W/2) keys.left = true; else keys.right = true; } 
    else { keys.left = false; keys.right = false; }
  }
}

canvas.addEventListener('touchstart', e => handleTouch(e, true), {passive: false});
canvas.addEventListener('touchend', e => handleTouch(e, false), {passive: false});

document.addEventListener('keydown', e => {
  if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = true;
  if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = true;
  if (e.key === ' ' || e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') { keys.jump = true; e.preventDefault(); }
  if (e.key === 'f' || e.key === 'F') keys.shoot = true;
});
document.addEventListener('keyup', e => {
  if (e.key === 'a' || e.key === 'A' || e.key === 'ArrowLeft') keys.left = false;
  if (e.key === 'd' || e.key === 'D' || e.key === 'ArrowRight') keys.right = false;
  if (e.key === ' ' || e.key === 'w' || e.key === 'W' || e.key === 'ArrowUp') keys.jump = false;
  if (e.key === 'f' || e.key === 'F') keys.shoot = false;
});

document.getElementById('startBtn').onclick = () => {
  initAudio(); startMusic(currentLevel); menuEl.classList.add('hidden'); 
  keys.left = false; keys.right = false; keys.jump = false; keys.shoot = false;
  resetGame(); loop();
};

if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    if (w < 2 * r) r = w / 2; if (h < 2 * r) r = h / 2;
    this.beginPath(); this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath(); return this;
  };
}

initLevelSelect();
</script>
